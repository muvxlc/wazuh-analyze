services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wazuh_dashboard_test
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wazuh_dashboard_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "55432:5432"
    # Disposable test database. Never use this service for local development data.
    tmpfs:
      - /var/lib/postgresql/data
