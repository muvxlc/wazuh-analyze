<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wazuh Alert System</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <i class="bi bi-shield-lock-fill"></i>
      <h1 class="h5 mb-0">Wazuh Alert Dashboard</h1>
    </header>

    <!-- Popup Selamat Datang -->
    <div id="welcome-popup" class="popup">
      <div class="popup-content">
        <h3>Welcome to Wazuh Alert Dashboard</h3>
        <p>Click the button below to start monitoring your alerts.</p>
        <button id="start-btn">Start Monitoring</button>
      </div>
    </div>

    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar Kiri -->
        <nav id="agent-sidebar" class="col-md-3 col-lg-2 d-md-block">
          <h5 class="mb-3 d-flex justify-content-between align-items-center">
            Connected Agents
            <button id="close-sidebar-btn" class="d-md-none">Close</button>
          </h5>
          <ul id="agent-list" class="list-unstyled">
            <!-- Daftar agent akan dimuat di sini -->
          </ul>
        </nav>

        <!-- Konten Utama -->
        <main class="col-md-9 col-lg-10 py-4">
          <div class="d-md-none mb-3">
            <button id="toggle-sidebar">☰ Agents</button>
          </div>

          <div class="row">
            <div class="col-lg-6 col-md-12 mb-4">
              <div id="alerts-container" class="card shadow-sm h-100">
                <div class="card-header">
                  <h2 class="h6 mb-0">Latest Alerts</h2>
                </div>
                <div class="card-body" id="alerts-list">
                  <!-- Alerts will be dynamically added here -->
                </div>
              </div>
            </div>

            <div class="col-lg-6 col-md-12 mb-4">
              <div id="archive-container" class="card shadow-sm h-100">
                <div class="card-header">
                  <h2 class="h6 mb-0">Archived Alerts</h2>
                </div>
                <div class="card-body" id="archive-list">
                  <!-- Archived alerts will go here -->
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>

    <audio id="alarm-sound" src="sounds/alarm.wav" preload="auto"></audio>

    <!-- Sidebar Script -->
    <script>
      document
        .getElementById("toggle-sidebar")
        .addEventListener("click", () => {
          document
            .getElementById("agent-sidebar")
            .classList.toggle("collapsed");
        });
      document
        .getElementById("close-sidebar-btn")
        .addEventListener("click", () => {
          document
            .getElementById("agent-sidebar")
            .classList.remove("collapsed");
        });
    </script>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
